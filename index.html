<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Generador de Claves TV</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{

background:#141414;
color:white;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

}

.container{

width:900px;
max-width:95%;

background:#1f1f1f;

padding:35px;

border-radius:18px;

box-shadow:0 0 40px rgba(229,9,20,.45);

}

h1{

text-align:center;
color:#e50914;

margin-bottom:10px;

}

.sub{

text-align:center;

color:#bbb;

margin-bottom:25px;

}

#clave{

background:#101010;

border:2px solid #e50914;

border-radius:12px;

padding:20px;

text-align:center;

font-size:34px;

font-family:Consolas;

letter-spacing:2px;

color:#00ff8c;

margin-bottom:25px;

user-select:all;

}

.botones{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:15px;

}

button{

padding:15px;

border:none;

border-radius:10px;

background:#e50914;

color:white;

font-size:18px;

cursor:pointer;

font-weight:bold;

transition:.25s;

}

button:hover{

background:#ff2d39;

transform:scale(1.03);

}

#estado{

height:25px;

margin-top:18px;

text-align:center;

font-weight:bold;

color:#00ff88;

}

.historial{

margin-top:30px;

background:#101010;

padding:18px;

border-radius:12px;

max-height:260px;

overflow:auto;

}

.historial h2{

color:#e50914;

margin-bottom:10px;

}

.item{

padding:8px;

border-bottom:1px solid #333;

font-family:Consolas;

font-size:18px;

}

.item:hover{

background:#222;

}

</style>

</head>

<body>

<div class="container">

<h1>🎬 Generador de Claves</h1>

<div class="sub">

Contraseñas fáciles para Smart TV

</div>

<div id="clave">

Generando...

</div>

<div class="botones">

<button onclick="generar()">
🎲 Generar
</button>

<button id="btnCopiar" onclick="copiar()">
📋 Copiar
</button>

<button onclick="limpiar()">
🗑 Limpiar
</button>

</div>

<div id="estado"></div>

<div class="historial">

<h2>Historial</h2>

<div id="lista"></div>

</div>

</div>

<script>

const palabras=[

"marcacion",

"automovil",

"clothes",

"defectuoso",

"superados",

"bressed",

"bones",

"yasuo"

];

const clave=document.getElementById("clave");
const lista=document.getElementById("lista");
const estado=document.getElementById("estado");
const boton=document.getElementById("btnCopiar");

function rnd(min,max){

return Math.floor(Math.random()*(max-min+1))+min;

}

function generar(){

let base=palabras[rnd(0,palabras.length-1)];

let claveFinal=base;

while(claveFinal.length<10){

let n=rnd(0,9);

if(claveFinal.slice(-4)!=(n.toString().repeat(4))){

claveFinal+=n;

}

}

let extra=rnd(0,4);

for(let i=0;i<extra;i++){

let n=rnd(0,9);

claveFinal+=n;

}

clave.textContent=claveFinal;

let div=document.createElement("div");

div.className="item";

div.textContent=claveFinal;

lista.prepend(div);

estado.textContent="";

}

function copiar(){

let texto=clave.textContent;

if(!texto){

return;

}

if(navigator.clipboard){

navigator.clipboard.writeText(texto).catch(copiaManual);

}else{

copiaManual();

}

boton.textContent="✅ Copiado";

boton.style.background="#00a651";

estado.textContent="Clave copiada al portapapeles.";

setTimeout(()=>{

boton.textContent="📋 Copiar";

boton.style.background="#e50914";

estado.textContent="";

},1800);

}

function copiaManual(){

let area=document.createElement("textarea");

area.value=clave.textContent;

document.body.appendChild(area);

area.select();

document.execCommand("copy");

document.body.removeChild(area);

}

function limpiar(){

lista.innerHTML="";

estado.textContent="Historial eliminado.";

setTimeout(()=>{

estado.textContent="";

},1500);

}

generar();

</script>

</body>
</html>
